<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4905 Argentina · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets\style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="13,2 4,14 11,14 9,22 20,9 13,9" fill="#ee5a1c"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">D4905</div>
          <div class="brand-sub">ARGENTINA</div>
        </div>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        Tienda oficial
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">Catálogo por club</div>
    <h1>El merch de tu club, en un solo lugar.</h1>
    <p>Elegí tu club y mirá sus productos oficiales D4905 con precio y disponibilidad al instante.</p>
  </section>

  <div class="chips-bar">
    <div id="chips" class="chips" data-chips></div>
  </div>

  <main class="main">
    <div id="countLabel" class="count-label"></div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>D4905 ARGENTINA · ⚡ Merch oficial</span>
      <span>Precios en pesos argentinos (ARS)</span>
    </div>
  </footer>

<script src="assets\script.js"></script>
</body>
</html>
