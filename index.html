<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D4905 Argentina · Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets\style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="13,2 4,14 11,14 9,22 20,9 13,9" fill="#ee5a1c"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">D4905</div>
          <div class="brand-sub">ARGENTINA</div>
        </div>
      </div>
      <div class="status">
        <span class="status-dot"></span>
        Tienda oficial
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">Catálogo por club</div>
    <h1>El merch de tu club, en un solo lugar.</h1>
    <p>Elegí tu club y mirá sus productos oficiales con precio y disponibilidad al instante durante los eventos distritales.</p>
  </section>

  <div class="chips-bar">
    <div id="chips" class="chips" data-chips></div>
  </div>

  <main class="main">
    <div id="countLabel" class="count-label"></div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>D4905 ARGENTINA · ⚡ Merch oficial de los clubes</span>
      <a href="https://www.instagram.com/rotaract_d4905" target="_blank" rel="noopener" class="footer-ig">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="2"></rect>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"></circle>
          <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"></circle>
        </svg>
        Rotaract Distrito 4905
      </a>
    </div>
  </footer>

  <div id="modalOverlay" class="modal-overlay" >
    <div class="modal-card">
      <button id="modalClose" class="modal-close" aria-label="Cerrar">✕</button>
      <div class="modal-img">
        <img id="modalImg" class="modal-photo" alt="">
      </div>
      <div class="modal-body">
        <div id="modalCategory" class="card-category"></div>
        <h2 id="modalName" class="modal-name"></h2>
        <p id="modalDesc" class="modal-desc"></p>
        <div class="modal-footer">
          <span id="modalPrice" class="modal-price"></span>
          <span id="modalStock" class="card-stock"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets\script.js"></script>
</body>

</html>
